name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Build against the gofastr commit go.mod pins, the way a fresh clone does.
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # javac compiles the generated Android shell against gobind's bindings.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: cross-compile
        run: |
          for t in ios/arm64 ios/amd64 android/arm64 android/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build ./mobilehost/... ./examples/...
          done

  ios-sim-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/gofastr-native build --platform ios-sim --pkg ./examples/notes/notesmobile
